name: Build

on:
  push:
    tags: [ '**' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
        fetch-depth: 0

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet packages
      run: |
        Invoke-WebRequest -Uri https://dist.nuget.org/win-x86-commandline/latest/nuget.exe -OutFile nuget.exe
        .\nuget.exe restore AudioPlaybackConnector.sln

    - name: Build x64
      run: msbuild AudioPlaybackConnector.sln -p:Configuration=Release -p:Platform=x64

    - name: Build x86
      run: msbuild AudioPlaybackConnector.sln -p:Configuration=Release -p:Platform=x86

    - name: Create Release (tag push only)
      if: startsWith(github.ref, 'refs/tags/')
      uses: ncipollo/release-action@v1
      with:
        artifacts: "x64/Release/AudioPlaybackConnector64.exe,Release/AudioPlaybackConnector32.exe"
        draft: true
        generateReleaseNotes: true
        token: ${{ secrets.GITHUB_TOKEN }}
